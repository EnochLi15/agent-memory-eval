name: Verify standalone HTTP evaluator
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 -m py_compile python/judge_bridge.py python/upstream/llm_judge.py python/upstream/llm_judge_runtime.py
